services:
  - type: web
    name: qlts-danko
    runtime: node
    plan: free
    buildCommand: npm run build
    # Keep startup short enough for Render's port scan. Seeding and legacy data
    # repair are maintenance operations and must not block every web restart.
    startCommand: cd backend && ./node_modules/.bin/prisma db push --skip-generate && cd .. && node backend/dist/src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qlts-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

databases:
  - name: qlts-postgres
    databaseName: qlts
    plan: free
